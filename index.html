<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>스플래툰 영상URL 검색</title>
<link rel="icon" type="image/png" href="images/logo.png">

<style>
h1 {
  font-family: 'Verdana', cursive;
  font-size: 30px;
  color: #5C4033;
}

body {
  font-family: Arial;
  background-color: #f5f5f5;
  margin: 0 auto;
  padding: 16px 12px;
  box-sizing: border-box;
  width: 100%;
  text-align: center;
}

h1 {
  text-align: center;
  width: 100%;
  box-sizing: border-box;
}

hr {
  width: 100%;
  box-sizing: border-box;
}

#count {
  text-align: center;
  max-width: 100%;
  overflow-wrap: anywhere;
}

.title-meta-row {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 2px 0 20px;
}

.subtitle {
  display: inline-block;
  font-size: 10px;
  color: white;
  margin-left: 1px;
}

.public-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  width: fit-content;
  margin: 0;
  font-size: 13px;
  line-height: 1.5;
  color: #888;
  cursor: pointer;
}

textarea {
  resize: none;
  overflow-y: auto;
  padding: 25px 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  width: 300px;
  max-width: 100%;
  box-sizing: border-box;
}

.section-box {
  background: white;
  padding: 1px 5px 25px 15px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 2px 2px 10px 2px rgba(0,0,0,0.2);
  width: min(370px, calc(100vw - 24px));
  box-sizing: border-box;
  margin-left: auto;
  margin-right: auto;
  text-align: left;
}

.dropdown {
  position: relative;
  width: 260px;
  margin-bottom: 10px;
}

.selected {
  border: 1px solid #ccc;
  padding: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: white;
  cursor: pointer;
  border-radius: 8px;
}

.options {
  display: none;
  border: 1px solid #ccc;
  position: absolute;
  left: 0;
  top: 100%;
  background: white;
  width: min(820px, 90vw);
  max-height: 560px;
  overflow-y: auto;
  z-index: 1000;
  border-radius: 8px;
  padding: 8px;
  box-sizing: border-box;
}

/* 룰 선택은 기존처럼 작은 썸네일과 세로 목록 유지 */
.options:not(.map-options) .option-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* 맵 선택 메뉴만 5열, 썸네일 아래에 맵 이름 표시 */
.map-options {
  grid-template-columns: repeat(5, minmax(0, 1fr));
  column-gap: 8px;
  row-gap: 10px;
}

.option-item {
  min-width: 0;
  padding: 6px;
  cursor: pointer;
  border-radius: 8px;
  box-sizing: border-box;
  overflow-wrap: anywhere;
}

.map-options .option-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 1px; /* 썸네일과 이름은 붙이고, 행 사이에는 row-gap으로 여유를 둠 */
  text-align: center;
  line-height: 1.2;
}

.option-item:hover {
  background: #eee;
}

.option-item.zero-count {
  color: #aaa;
}

/* 선택한 룰에 영상이 없는 맵은 썸네일 채도도 절반으로 낮춤 */
.option-item.zero-count .thumbnail {
  filter: saturate(10%) brightness(160%);
}

/* 기본 썸네일과 룰 썸네일은 30px 유지 */
.thumbnail {
  width: 30px;
  height: 30px;
  flex: 0 0 30px;
  object-fit: cover;
  border-radius: 6px;
}

/* 선택된 맵을 보여주는 버튼의 썸네일만 120x120px로 확대. 룰 버튼은 30x30px 유지 */
.selected.map-selected {
  align-items: center;
}

.selected.map-selected span {
  display: flex;
  align-items: center;
  min-height: 120px;
}

.selected.map-selected .thumbnail {
  width: 120px;
  height: 120px;
  flex: 0 0 120px;
  border-radius: 8px;
}

/* 맵 선택 목록의 썸네일만 기존 4배인 120px */
.map-options .thumbnail {
  display: block;
  width: 120px;
  height: 120px;
  flex: 0 0 120px;
  object-fit: cover;
  border-radius: 8px;
  margin: 0;
}

.map-offset {
  margin-left: 30px;
  font-size: 14px;
}

.delete-map-thumbnail {
  width: 60px;
  height: 60px;
  object-fit: cover;
  border-radius: 7px;
  vertical-align: middle;
  margin-right: 8px;
  flex: 0 0 60px;
}

.delete-entry {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-radius: 6px;
  overflow-wrap: anywhere;
}

.delete-entry-content {
  min-width: 0;
}

.delete-entry-content a {
  overflow-wrap: anywhere;
  word-break: break-word;
}

button {
  padding: 12px 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background-color: #555555;
  color: white;
  font-size: 12px;
}

button:hover {
  opacity: 0.8;
}

.save-button-row {
  display: flex;
  justify-content: center;
  margin-top: 16px;
}

.public-toggle input {
  cursor: pointer;
}

input[type="text"] {
  padding: 25px 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  width: 300px;
  margin-top: 5px;
}

#deleteSection {
  background: white;
  padding: 15px;
  margin-top: 5px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
  width: min(350px, calc(100vw - 24px));
  box-sizing: border-box;
  margin-left: auto;
  margin-right: auto;
  text-align: left;
}

@media (max-width: 720px) {
  .map-options {
    width: min(92vw, 340px);
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 8px;
    row-gap: 10px;
  }

  .map-options .thumbnail {
    width: 120px;
    height: 120px;
    flex-basis: 120px;
  }
}
</style>
</head>

<body>

<h1>★ 룰/맵 별 영상 URL 검색기 ★</h1>

<div class="title-meta-row">
  <span class="subtitle">(제작_오렌지징어 잉클링갤러리)</span>
  <label class="public-toggle" for="includePublicVideos">
    <input type="checkbox" id="includePublicVideos" checked onchange="updateVideoSourceView()">
    제작자의 스시 영상들 표시하기
  </label>
</div>



<div class="section-box">
  <h2> 🔎 검색하기 </h2>
  <div id="searchRuleDropdown" class="dropdown"></div>
  <div id="searchMapDropdown" class="dropdown map-offset"></div>
  <div id="result">룰과 맵을 선택하여 검색하세요.</div>
</div>

<div class="section-box">
  <h2> 💾 새로운 URL 등록 </h2>
  <div id="ruleDropdown" class="dropdown"></div>
  <div id="map1Dropdown" class="dropdown map-offset"></div>
  <div id="map2Dropdown" class="dropdown map-offset"></div>

  <textarea id="url" placeholder="여기에 URL을 입력하세요." rows="3"></textarea>
  <div class="save-button-row">
    <button onclick="saveVideo()" style="background-color:#FFF9C4; color:black; border:2px solid black;">💾 저장 💾</button>
  </div>
</div>

<p id="count"></p>
<button id="deleteToggleButton" onclick="toggleDeleteList()" aria-expanded="false">💩 내 URL 삭제하기 <span id="deleteToggleIcon">▼</span></button>
<div id="deleteSection" style="display:none;"></div><br><br><br>

<hr>

<button onclick="exportData()" style="background-color:#d3d3d3;">📤 내 URL 백업하기</button>
<br><br>
📩 내 URL 백업 가져오기 <br>
<input type="file" id="importFile" accept=".json" onchange="importData(event)"><br>

<script>
const rules = ["에어리어","랭크 타워","랭크 피시","바지락"];
const maps = [
"거미게 경제특구","고등어 해협대교","과메기 온천","광어 해운",
"나메로우 금속","남플라 유적","넙치 언덕단지","다시마 트랙",
"대구포트 쇼핑파크","대치 시장","데카라인 고가밑","도미 미술관",
"만새기 리조트&스파","만타 마리아호","맛조개 방수로","메기 지구",
"석순 대협곡","수랑정","용궁 터미널","참치 탄광",
"철갑상어 조선소","청새치 공항","초밥 월드",
"해녀 미술대학","혹등 마켓"
];

let selected = {
  rule: rules[0],
  map1: maps[0],
  map2: maps[1],
  searchRule: rules[0],
  searchMap: maps[0]
};

/* ---------------- 공용 라이브러리 + 개인 저장소 ---------------- */
const PERSONAL_KEY = "personalVideos";
let publicVideos = [];
function getPersonalVideos(){
  try { return JSON.parse(localStorage.getItem(PERSONAL_KEY)) || []; }
  catch { return []; }
}
function savePersonalVideos(videos){
  localStorage.setItem(PERSONAL_KEY, JSON.stringify(videos));
}
function getAllVideos(){
  return [...publicVideos, ...getPersonalVideos()];
}

// 체크 여부에 따라 검색과 맵별 카운트에 사용할 영상 목록을 결정
function getVisibleVideos(){
  const includePublic = document.getElementById("includePublicVideos")?.checked ?? true;
  return includePublic ? getAllVideos() : getPersonalVideos();
}

function updateVideoSourceView(){
  refreshAllMapDropdowns();
  searchVideo();
  updateCount();
}
async function loadPublicVideos(){
  try {
    const response = await fetch("./public-videos.json");
    if (!response.ok) throw new Error("공용 데이터 파일을 불러오지 못했습니다.");
    const data = await response.json();
    publicVideos = Array.isArray(data) ? data.map(v => ({...v, source: "public"})) : [];
  } catch (error) {
    console.error(error);
    publicVideos = [];
    document.getElementById("result").innerHTML = "공용 라이브러리를 불러오지 못했습니다. public-videos.json 파일을 확인하세요.";
  }
  refreshAllMapDropdowns();
  searchVideo();
  updateCount();
}

/* ---------------- 카운트 계산 ---------------- */
function getMapCount(rule, map){
  return getVisibleVideos().filter(v=>v.rule===rule && v.map===map).length;
}

/* ---------------- 드롭다운 생성 ---------------- */
function createDropdown(id, dataArray) {
  const container = document.getElementById(id + "Dropdown");
  const initialItem = selected[id] || dataArray[0];

  container.innerHTML = `
    <div class="selected ${dataArray.some(item => maps.includes(item)) ? 'map-selected' : ''}" onclick="toggleDropdown('${id}')">
      <img class="thumbnail" id="${id}Img" src="images/${initialItem}.png">
      <span id="${id}Text">${initialItem}</span>
    </div>
    <div class="options ${dataArray.some(item => maps.includes(item)) ? 'map-options' : ''}" id="${id}Options"></div>
  `;

  renderOptions(id, dataArray);
}

function renderOptions(id, dataArray){
  const optionsDiv = document.getElementById(id + "Options");
  optionsDiv.innerHTML = "";

  dataArray.forEach(item => {
    const div = document.createElement("div");
    div.className = "option-item";

    let count = 0;
    let ruleForCount = null;

    if(id.includes("searchMap")){
      ruleForCount = selected.searchRule;
    }else if(id.includes("map")){
      ruleForCount = selected.rule;
    }

    if(ruleForCount){
      count = getMapCount(ruleForCount, item);
      if(count === 0){
        div.classList.add("zero-count");
      }
    }

    div.innerHTML = `
      <img class="thumbnail" src="images/${item}.png">
      <span>${item}${ruleForCount ? ` (${count})` : ""}</span>
    `;

    div.onclick = () => {
      selected[id] = item;
      document.getElementById(id + "Text").innerText = item;
      document.getElementById(id + "Img").src = `images/${item}.png`;
      optionsDiv.style.display = "none";

      if(id === "rule"){
        renderOptions("map1", maps);
        renderOptions("map2", maps);
      }

      if(id === "searchRule"){
        renderOptions("searchMap", maps);
        searchVideo();
      }

      if(id === "searchMap"){
        searchVideo();
      }
    };
    optionsDiv.appendChild(div);
  });
}

function refreshAllMapDropdowns(){
  renderOptions("map1", maps);
  renderOptions("map2", maps);
  renderOptions("searchMap", maps);
}

function toggleDropdown(id) {
  const el = document.getElementById(id + "Options");
  const openDisplay = el.classList.contains("map-options") ? "grid" : "block";
  const isOpen = el.style.display === openDisplay;
  document.querySelectorAll(".options").forEach(options => options.style.display = "none");
  el.style.display = isOpen ? "none" : openDisplay;
}

document.addEventListener("click", function(e){
  if(!e.target.closest(".dropdown")){
    document.querySelectorAll(".options").forEach(o=>o.style.display="none");
  }
});

/* ---------------- 초기 생성 ---------------- */
createDropdown("rule", rules);
createDropdown("map1", maps);
createDropdown("map2", maps);
createDropdown("searchRule", rules);
createDropdown("searchMap", maps);
refreshAllMapDropdowns();
loadPublicVideos();

/* ---------------- 저장 ---------------- */
function saveVideo() {
  const rule = selected.rule;
  const map1 = selected.map1;
  const map2 = selected.map2;
  const url = document.getElementById("url").value.trim();

  if (!url) { alert("URL을 입력하세요"); return; }
  if (map1 === map2) { alert("서로 다른 맵 2개를 선택해주세요."); return; }

  const videos = getPersonalVideos();
  const createdAt = new Date().toISOString();

  videos.push({ rule, map: map1, url, createdAt });
  videos.push({ rule, map: map2, url, createdAt });

  savePersonalVideos(videos);

  refreshAllMapDropdowns();
  document.getElementById("url").value = "";
  updateCount();

  const countEl = document.getElementById("count");
  const exclamation = document.createElement("span");
  exclamation.innerText = " 🦑🦑🦑🦑🦑🦑🦑🦑🦑🦑🦑🦑";
  countEl.appendChild(exclamation);
  setTimeout(() => countEl.removeChild(exclamation), 1500);

  renderDeleteList();
}

/* ---------------- 검색 ---------------- */
function searchVideo(){
  const searchRule = selected.searchRule;
  const searchMap = selected.searchMap;
  const videos = getVisibleVideos();

  const filtered = videos
    .filter(v => v.rule === searchRule && v.map === searchMap)
    .sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));

  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = "";

  if(filtered.length === 0){
    resultDiv.innerHTML = "<p>검색 결과가 없습니다.</p>";
    return;
  }

  let index = 1;
  filtered.forEach(v=>{
    // URL과 설명 분리
    const parts = v.url.split(" ");
    const mainUrl = parts[0];
    const description = parts.slice(1).join(" "); // URL 뒤 텍스트

    resultDiv.innerHTML += `
      <p>
        ${index++}) 
        <a href="${mainUrl}" target="_blank">${mainUrl}</a> 
        <span style="color:black;">${description}</span>
      </p>
    `;
  });
}

function toggleDeleteList(){
  const section = document.getElementById("deleteSection");
  const button = document.getElementById("deleteToggleButton");
  const icon = document.getElementById("deleteToggleIcon");
  const isOpening = section.style.display === "none";
  section.style.display = isOpening ? "block" : "none";
  button.setAttribute("aria-expanded", String(isOpening));
  icon.textContent = isOpening ? "▲" : "▼";
  renderDeleteList();
}

function renderDeleteList(){
  const videos = getPersonalVideos();
  const section = document.getElementById("deleteSection");
  section.innerHTML = "";

  if(videos.length === 0){
    section.innerHTML = "개인적으로 저장한 URL이 없습니다. 제작자의 데이터는 삭제할 수 없습니다.";
    return;
  }

  section.innerHTML += `<button onclick="deleteAll()" style="background-color:red;">💀💀 전체 삭제 💀💀</button><hr>`;
  const sortedVideos = [...videos].sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  let toggleColor = false;
  let prevUrl = "";

  sortedVideos.forEach(v=>{
    if(v.url !== prevUrl){
      toggleColor = !toggleColor;
      prevUrl = v.url;
    }
    const bgColor = toggleColor ? "#e4e4e4" : "#ffffff";
    const entry = document.createElement("div");
    entry.className = "delete-entry";
    entry.style.backgroundColor = bgColor;

    const img = document.createElement("img");
    img.className = "delete-map-thumbnail";
    img.src = `images/${v.map}.png`;
    img.alt = `${v.map} 맵 썸네일`;
    img.onerror = function(){ this.style.display = "none"; };

    const content = document.createElement("div");
    content.className = "delete-entry-content";
    const label = document.createElement("div");
    label.textContent = `[ ${v.rule} - ${v.map} ]`;
    const link = document.createElement("a");
    link.href = v.url.split(" ")[0];
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = v.url;
    const date = document.createElement("small");
    date.textContent = new Date(v.createdAt).toLocaleString();
    const deleteButton = document.createElement("button");
    deleteButton.textContent = "삭제";
    deleteButton.onclick = () => deleteUrl(v.url);

    content.append(label, link, document.createElement("br"), date, document.createElement("br"), deleteButton);
    entry.append(img, content);
    section.append(entry, document.createElement("hr"));
  });
}
function deleteUrl(url){
  let videos = getPersonalVideos();
  videos = videos.filter(v=>v.url !== url);
  savePersonalVideos(videos);
  renderDeleteList();
  updateCount();
  searchVideo();
}

function deleteAll(){
  if(confirm("정말 모든 URL을 삭제하시겠습니까?")){
    localStorage.removeItem(PERSONAL_KEY);
    renderDeleteList();
    updateCount();
    searchVideo();
  }
}

/* ------------------- Export / Import ------------------- */
function exportData(){
  const data = JSON.stringify(getPersonalVideos(), null, 2);
  const blob = new Blob([data], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "personal-videos-backup.json";
  a.click();
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if (!Array.isArray(parsed)) throw new Error("JSON 데이터는 배열이어야 합니다.");
      const existing = getPersonalVideos();
      const merged = [...existing, ...parsed.map(v => ({...v, source: undefined}))];
      savePersonalVideos(merged);
      updateCount();
      renderDeleteList();
      alert("데이터 불러오기 완료!");
    }catch{
      alert("올바른 JSON 파일이 아닙니다.");
    }
  };
  reader.readAsText(file);
}

/* ------------------- 카운트 업데이트 ------------------- */
function updateCount() {
  // URL 하나가 맵별로 두 항목에 저장되므로 전체 항목 수를 2로 나눠 표시
  const totalUrlCount = Math.floor(getVisibleVideos().length / 2);
  document.getElementById("count").innerText =
    `* 영상 URL 총 개수 : ${totalUrlCount}`;
}

document.getElementById("url").addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    saveVideo();
  }
});

updateCount();
</script>

</body>
<br><br><br><br><br><br>
</html>
